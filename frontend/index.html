<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceAgent — AI Outbound Calls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #111118;
      --border:    #1e1e2e;
      --accent:    #7c5cfc;
      --accent2:   #c084fc;
      --green:     #34d399;
      --yellow:    #fbbf24;
      --red:       #f87171;
      --text:      #e2e0ff;
      --muted:     #6b6a8a;
      --card-bg:   #13131c;
      --radius:    14px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* ── Noise grain overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
      opacity: 0.6;
    }

    /* ── Glow orbs ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 { width: 600px; height: 600px; background: rgba(124,92,252,0.12); top: -200px; right: -100px; }
    .orb-2 { width: 400px; height: 400px; background: rgba(192,132,252,0.08); bottom: 100px; left: -100px; }

    /* ── Layout ── */
    .shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 340px 1fr;
      grid-template-rows: auto 1fr;
    }

    /* ── Header ── */
    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .logo-text { color: var(--text); }
    .logo-text span { color: var(--accent2); }

    .status-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px;
      background: rgba(52,211,153,0.08);
      border: 1px solid rgba(52,211,153,0.2);
      border-radius: 100px;
      font-size: 11px;
      color: var(--green);
      letter-spacing: 0.5px;
    }
    .status-dot {
      width: 6px; height: 6px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50% { opacity:0.5; transform:scale(0.8); }
    }

    /* ── Sidebar ── */
    .sidebar {
      border-right: 1px solid var(--border);
      padding: 28px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* Form inputs */
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 11px; color: var(--muted); letter-spacing: 0.5px; }
    .input-group input, .input-group textarea {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    .input-group input:focus, .input-group textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,92,252,0.15);
    }
    .input-group input::placeholder { color: var(--muted); }
    .input-group textarea { resize: vertical; min-height: 72px; }

    /* Scenario grid */
    .scenario-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .scenario-card {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--surface);
      display: flex; align-items: flex-start; gap: 10px;
    }
    .scenario-card:hover { border-color: rgba(124,92,252,0.4); background: rgba(124,92,252,0.05); }
    .scenario-card.active {
      border-color: var(--accent);
      background: rgba(124,92,252,0.12);
    }
    .scenario-card .s-icon { font-size: 20px; margin-top: 1px; flex-shrink: 0; }
    .scenario-card .s-info {}
    .scenario-card .s-name {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .scenario-card .s-desc {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      line-height: 1.4;
    }
    .scenario-card.active .s-name { color: var(--accent2); }

    /* Call button */
    .call-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      position: relative;
      overflow: hidden;
    }
    .call-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .call-btn:hover::before { opacity: 1; }
    .call-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(124,92,252,0.4); }
    .call-btn:active { transform: translateY(0); }
    .call-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .call-btn.calling {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Main panel ── */
    .main-panel {
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow-y: auto;
    }

    /* Active call card */
    .active-call-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: none;
    }
    .active-call-card.visible { display: block; }

    .call-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .call-header-left { display: flex; align-items: center; gap: 12px; }
    .call-avatar {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .call-meta-name {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
    }
    .call-meta-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .call-status-badge {
      padding: 5px 12px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .badge-ringing  { background: rgba(251,191,36,0.1);  color: var(--yellow); border: 1px solid rgba(251,191,36,0.2); }
    .badge-active   { background: rgba(52,211,153,0.1);  color: var(--green);  border: 1px solid rgba(52,211,153,0.2); }
    .badge-done     { background: rgba(107,106,138,0.1); color: var(--muted);  border: 1px solid rgba(107,106,138,0.2); }
    .badge-failed   { background: rgba(248,113,113,0.1); color: var(--red);    border: 1px solid rgba(248,113,113,0.2); }

    /* Waveform animation */
    .waveform {
      display: flex; align-items: center; gap: 3px;
      height: 32px; margin: 16px 0;
    }
    .wave-bar {
      width: 3px;
      background: linear-gradient(to top, var(--accent), var(--accent2));
      border-radius: 2px;
      animation: wave 1.2s ease-in-out infinite;
    }
    .wave-bar:nth-child(1)  { animation-delay: 0.0s; }
    .wave-bar:nth-child(2)  { animation-delay: 0.1s; }
    .wave-bar:nth-child(3)  { animation-delay: 0.2s; }
    .wave-bar:nth-child(4)  { animation-delay: 0.3s; }
    .wave-bar:nth-child(5)  { animation-delay: 0.4s; }
    .wave-bar:nth-child(6)  { animation-delay: 0.3s; }
    .wave-bar:nth-child(7)  { animation-delay: 0.2s; }
    .wave-bar:nth-child(8)  { animation-delay: 0.1s; }
    .wave-bar:nth-child(9)  { animation-delay: 0.0s; }
    .wave-bar:nth-child(10) { animation-delay: 0.1s; }
    .wave-bar:nth-child(11) { animation-delay: 0.2s; }
    .wave-bar:nth-child(12) { animation-delay: 0.3s; }
    @keyframes wave {
      0%,100% { height: 6px; }
      50% { height: 28px; }
    }
    .waveform.paused .wave-bar { animation-play-state: paused; height: 6px; }

    .call-timer {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -1px;
    }

    .call-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .info-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .info-box-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
    .info-box-value { font-size: 13px; color: var(--text); margin-top: 4px; }

    .end-call-btn {
      margin-top: 16px;
      padding: 10px 20px;
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 8px;
      color: var(--red);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .end-call-btn:hover { background: rgba(248,113,113,0.2); }

    /* Call history */
    .history-section {}
    .history-title {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .history-count {
      background: rgba(124,92,252,0.15);
      color: var(--accent2);
      padding: 2px 8px;
      border-radius: 100px;
      font-size: 11px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      transition: border-color 0.2s;
      cursor: pointer;
    }
    .history-item:hover { border-color: rgba(124,92,252,0.3); }

    .h-icon {
      width: 36px; height: 36px;
      background: var(--surface);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
    }
    .h-info {}
    .h-phone { font-size: 13px; color: var(--text); }
    .h-scenario { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .h-right { text-align: right; }
    .h-time { font-size: 10px; color: var(--muted); }

    .status-chip {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 100px;
      font-size: 10px;
      margin-top: 4px;
    }
    .chip-ringing    { background: rgba(251,191,36,0.1);  color: var(--yellow); }
    .chip-in-progress{ background: rgba(52,211,153,0.1);  color: var(--green);  }
    .chip-completed  { background: rgba(107,106,138,0.15);color: var(--muted);  }
    .chip-failed     { background: rgba(248,113,113,0.1);  color: var(--red);    }
    .chip-no-answer  { background: rgba(251,191,36,0.1);   color: var(--yellow); }
    .chip-cancelled  { background: rgba(107,106,138,0.1);  color: var(--muted);  }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
    .empty-state-text { font-size: 13px; }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: 24px; right: 24px;
      display: flex; flex-direction: column; gap: 8px;
      z-index: 2000;
    }
    .toast {
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 12px;
      max-width: 320px;
      animation: slide-in 0.3s ease;
      backdrop-filter: blur(12px);
    }
    .toast-success { background: rgba(52,211,153,0.15); border: 1px solid rgba(52,211,153,0.3); color: var(--green); }
    .toast-error   { background: rgba(248,113,113,0.15); border: 1px solid rgba(248,113,113,0.3); color: var(--red); }
    .toast-info    { background: rgba(124,92,252,0.15); border: 1px solid rgba(124,92,252,0.3); color: var(--accent2); }
    @keyframes slide-in { from { transform: translateX(120%); opacity:0; } to { transform: translateX(0); opacity:1; } }

    /* Responsive */
    @media (max-width: 768px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="shell">
    <!-- Header -->
    <header>
      <div class="logo">
        <div class="logo-icon">📞</div>
        <div class="logo-text">Voice<span>Agent</span></div>
      </div>
      <div class="status-pill">
        <div class="status-dot"></div>
        API READY
      </div>
    </header>

    <!-- Sidebar: controls -->
    <aside class="sidebar">
      <div>
        <div class="section-label">Phone Number</div>
        <div class="input-group">
          <label>E.164 format (e.g. +12025551234)</label>
          <input type="tel" id="phoneInput" placeholder="+1 (555) 000-0000" />
        </div>
      </div>

      <div>
        <div class="section-label">Customer Name (optional)</div>
        <div class="input-group">
          <label>First name for personalised greeting</label>
          <input type="text" id="nameInput" placeholder="Jane" />
        </div>
      </div>

      <div>
        <div class="section-label">Scenario</div>
        <div class="scenario-grid" id="scenarioGrid">
          <!-- Populated by JS -->
        </div>
      </div>

      <div>
        <div class="section-label">Extra Context (optional)</div>
        <div class="input-group">
          <label>Additional instructions for the agent</label>
          <textarea id="contextInput" placeholder="e.g. Customer has VIP status, offer 20% discount if hesitant."></textarea>
        </div>
      </div>

      <button class="call-btn" id="callBtn" onclick="initiateCall()">
        <span>📞</span>
        <span id="callBtnText">Start Call</span>
      </button>
    </aside>

    <!-- Main panel: active call + history -->
    <main class="main-panel">
      <!-- Active call -->
      <div class="active-call-card" id="activeCallCard">
        <div class="call-header">
          <div class="call-header-left">
            <div class="call-avatar" id="callAvatar">📞</div>
            <div>
              <div class="call-meta-name" id="callMetaName">—</div>
              <div class="call-meta-sub" id="callMetaSub">—</div>
            </div>
          </div>
          <div class="call-status-badge badge-ringing" id="callStatusBadge">RINGING</div>
        </div>

        <div class="call-timer" id="callTimer">0:00</div>

        <div class="waveform paused" id="waveform">
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
        </div>

        <div class="call-info-grid">
          <div class="info-box">
            <div class="info-box-label">Scenario</div>
            <div class="info-box-value" id="infoScenario">—</div>
          </div>
          <div class="info-box">
            <div class="info-box-label">Agent</div>
            <div class="info-box-value" id="infoAgent">—</div>
          </div>
          <div class="info-box">
            <div class="info-box-label">Call ID</div>
            <div class="info-box-value" id="infoCallId" style="font-size:10px; word-break:break-all;">—</div>
          </div>
          <div class="info-box">
            <div class="info-box-label">Status</div>
            <div class="info-box-value" id="infoStatus">—</div>
          </div>
        </div>

        <button class="end-call-btn" id="endCallBtn" onclick="endCurrentCall()">
          ✕ End Call
        </button>
      </div>

      <!-- Call history -->
      <div class="history-section">
        <div class="history-title">
          Call History
          <span class="history-count" id="historyCount">0</span>
        </div>
        <div class="history-list" id="historyList">
          <div class="empty-state">
            <div class="empty-state-icon">🌙</div>
            <div class="empty-state-text">No calls yet. Start one from the left panel.</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const API = 'http://localhost:8001/api';

    // ── State ──────────────────────────────────────────────────────────────────
    let scenarios = [];
    let selectedScenario = null;
    let activeCallId = null;
    let timerInterval = null;
    let pollInterval = null;
    let callStartTime = null;
    const callHistory = [];

    // ── Init ───────────────────────────────────────────────────────────────────
    (async () => {
      await loadScenarios();
    })();

    async function loadScenarios() {
      try {
        const res = await fetch(`${API}/scenarios`);
        scenarios = await res.json();
        renderScenarioGrid();
        // Select first by default
        if (scenarios.length) selectScenario(scenarios[0].id);
      } catch (e) {
        toast('Could not reach backend. Is the server running?', 'error');
      }
    }

    function renderScenarioGrid() {
      const grid = document.getElementById('scenarioGrid');
      grid.innerHTML = scenarios.map(s => `
        <div class="scenario-card ${selectedScenario === s.id ? 'active' : ''}"
             id="sc-${s.id}" onclick="selectScenario('${s.id}')">
          <div class="s-icon">${s.icon}</div>
          <div class="s-info">
            <div class="s-name">${s.name}</div>
            <div class="s-desc">${s.description}</div>
          </div>
        </div>
      `).join('');
    }

    function selectScenario(id) {
      selectedScenario = id;
      document.querySelectorAll('.scenario-card').forEach(el => el.classList.remove('active'));
      const el = document.getElementById(`sc-${id}`);
      if (el) el.classList.add('active');
    }

    // ── Initiate call ──────────────────────────────────────────────────────────
    async function initiateCall() {
      const phone = document.getElementById('phoneInput').value.trim();
      const name  = document.getElementById('nameInput').value.trim();
      const ctx   = document.getElementById('contextInput').value.trim();

      if (!phone) { toast('Please enter a phone number', 'error'); return; }
      if (!selectedScenario) { toast('Please select a scenario', 'error'); return; }

      // Button loading state
      const btn = document.getElementById('callBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div><span>Connecting…</span>';

      try {
        const body = { phone_number: phone, scenario_id: selectedScenario };
        if (name) body.customer_name = name;
        if (ctx)  body.additional_context = ctx;

        const res = await fetch(`${API}/calls`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Unknown error');

        activeCallId = data.call_id;
        callStartTime = Date.now();

        showActiveCallCard(data);
        startTimer();
        startPolling();
        addToHistory(data);

        toast(`${data.agent_name} is calling ${phone}`, 'success');

        // Reset button to "End" mode handled by active card
        btn.disabled = false;
        btn.innerHTML = '<span>📞</span><span id="callBtnText">Start Call</span>';

      } catch (err) {
        toast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<span>📞</span><span id="callBtnText">Start Call</span>';
      }
    }

    // ── Active call card ───────────────────────────────────────────────────────
    function showActiveCallCard(data) {
      const sc = scenarios.find(s => s.id === data.scenario_id) || {};
      document.getElementById('activeCallCard').classList.add('visible');
      document.getElementById('callAvatar').textContent = sc.icon || '📞';
      document.getElementById('callMetaName').textContent = data.phone_number;
      document.getElementById('callMetaSub').textContent = `${data.scenario_name} · ${data.agent_name}`;
      document.getElementById('infoScenario').textContent = data.scenario_name;
      document.getElementById('infoAgent').textContent = data.agent_name;
      document.getElementById('infoCallId').textContent = data.call_id;
      updateCallStatusDisplay(data.status);
    }

    function updateCallStatusDisplay(status) {
      const badge = document.getElementById('callStatusBadge');
      const wave  = document.getElementById('waveform');
      const infoStatus = document.getElementById('infoStatus');

      infoStatus.textContent = status;

      const configs = {
        'pending':     { cls: 'badge-ringing', label: 'PENDING',     wave: false },
        'ringing':     { cls: 'badge-ringing', label: 'RINGING',     wave: false },
        'in-progress': { cls: 'badge-active',  label: 'LIVE',        wave: true  },
        'completed':   { cls: 'badge-done',    label: 'COMPLETED',   wave: false },
        'failed':      { cls: 'badge-failed',  label: 'FAILED',      wave: false },
        'cancelled':   { cls: 'badge-done',    label: 'CANCELLED',   wave: false },
        'no-answer':   { cls: 'badge-failed',  label: 'NO ANSWER',   wave: false },
      };

      const cfg = configs[status] || { cls: 'badge-ringing', label: status.toUpperCase(), wave: false };
      badge.className = `call-status-badge ${cfg.cls}`;
      badge.textContent = cfg.label;
      wave.classList.toggle('paused', !cfg.wave);
    }

    // ── End call ───────────────────────────────────────────────────────────────
    async function endCurrentCall() {
      if (!activeCallId) return;
      try {
        await fetch(`${API}/calls/${activeCallId}`, { method: 'DELETE' });
        toast('Call ended', 'info');
        finalizeCall('cancelled');
      } catch (e) {
        toast('Failed to end call', 'error');
      }
    }

    function finalizeCall(status) {
      clearInterval(timerInterval);
      clearInterval(pollInterval);
      updateCallStatusDisplay(status);

      // Update history
      const item = callHistory.find(c => c.call_id === activeCallId);
      if (item) { item.status = status; renderHistory(); }

      // Hide active card after a moment
      setTimeout(() => {
        document.getElementById('activeCallCard').classList.remove('visible');
        activeCallId = null;
      }, 3000);
    }

    // ── Timer ──────────────────────────────────────────────────────────────────
    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const s = Math.floor((Date.now() - callStartTime) / 1000);
        const m = Math.floor(s / 60);
        document.getElementById('callTimer').textContent =
          `${m}:${String(s % 60).padStart(2, '0')}`;
      }, 1000);
    }

    // ── Poll call status ───────────────────────────────────────────────────────
    function startPolling() {
      clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        if (!activeCallId) { clearInterval(pollInterval); return; }
        try {
          const res = await fetch(`${API}/calls/${activeCallId}`);
          const data = await res.json();
          updateCallStatusDisplay(data.status);

          // Update history
          const item = callHistory.find(c => c.call_id === activeCallId);
          if (item) { item.status = data.status; renderHistory(); }

          const terminal = ['completed','failed','cancelled','no-answer'];
          if (terminal.includes(data.status)) finalizeCall(data.status);
        } catch {}
      }, 3000);
    }

    // ── History ────────────────────────────────────────────────────────────────
    function addToHistory(data) {
      callHistory.unshift({ ...data, ts: new Date() });
      renderHistory();
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      document.getElementById('historyCount').textContent = callHistory.length;

      if (!callHistory.length) {
        list.innerHTML = `<div class="empty-state">
          <div class="empty-state-icon">🌙</div>
          <div class="empty-state-text">No calls yet.</div>
        </div>`;
        return;
      }

      const sc_map = Object.fromEntries(scenarios.map(s => [s.id, s]));

      list.innerHTML = callHistory.map(c => {
        const sc = sc_map[c.scenario_id] || {};
        const chipClass = {
          'pending': 'chip-ringing', 'ringing': 'chip-ringing',
          'in-progress': 'chip-in-progress', 'completed': 'chip-completed',
          'failed': 'chip-failed', 'no-answer': 'chip-no-answer',
          'cancelled': 'chip-cancelled',
        }[c.status] || 'chip-ringing';

        const timeStr = c.ts ? c.ts.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';

        return `<div class="history-item">
          <div class="h-icon">${sc.icon || '📞'}</div>
          <div class="h-info">
            <div class="h-phone">${c.phone_number}</div>
            <div class="h-scenario">${c.scenario_name || c.scenario_id} · ${c.agent_name || ''}</div>
          </div>
          <div class="h-right">
            <div class="h-time">${timeStr}</div>
            <span class="status-chip ${chipClass}">${c.status.toUpperCase()}</span>
          </div>
        </div>`;
      }).join('');
    }

    // ── Toast ──────────────────────────────────────────────────────────────────
    function toast(msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }
  </script>
</body>
</html>
